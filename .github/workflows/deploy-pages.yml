# Deploy site/ to Cloudflare Pages on push to main.
# Alternative to CF Pages native Git integration.
# Requires the CF_API_TOKEN repository secret (Cloudflare API token with
# "Cloudflare Pages: Edit" permission). While the secret is absent the
# deployment step is skipped instead of failing; add the secret to enable it.
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Secrets cannot be referenced directly in `if:`; mirror to env first
      # (docs.github.com/actions/security-guides/using-secrets-in-github-actions).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy site --project-name s1er --branch main
