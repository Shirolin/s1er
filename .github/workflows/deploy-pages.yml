# Deploy site/ to Cloudflare Pages on push to main.
# Alternative to CF Pages native Git integration.
# Requires the CF_API_TOKEN repository secret (Cloudflare API token with
# "Cloudflare Pages: Edit" permission). While the secret is absent the job is
# skipped instead of failing; add the secret to enable the deployment.
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.CF_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy site --project-name s1er --branch main
