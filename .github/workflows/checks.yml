name: Checks

# Static gates for the Flutter app. The iOS smoke workflow covers the Apple
# build; this one covers analyzer, the repo-owned design/policy audits, and
# (on PRs) the test suite.
on:
  pull_request:
    paths:
      - "lib/**"
      - "scripts/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/checks.yml"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "scripts/**"
      - "pubspec.yaml"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pin the SDK: `channel: stable` silently moves to a newer release and
          # new lints can turn this gate red without any code change.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: M3 audit
        # `dart <script>` skips the package's native build hooks; `dart run`
        # would cold-build cnativeapi (a tray_manager dependency) first.
        run: dart scripts/audit_m3.dart --fail-on-error

      - name: Mouse cursor policy audit
        run: dart scripts/audit_cursors.dart --fail-on-error

  tests:
    # PRs get the full suite; a push to main repeats a commit that was already
    # tested in its PR, so only the fast static gates run there.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install GTK/X11 dev headers
        # `flutter test` 会为宿主构建原生资产；cnativeapi（tray_manager 依赖）的
        # build hook 通过 pkg-config 查找 GTK3/X11/Xi，缓存未命中时必须冷编译。
        # PR 的 actions/cache 不跨 PR 共享，基本每次都是冷编译。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libx11-dev libxi-dev

      # `flutter test` builds the native assets for the host, which compiles
      # cnativeapi (tray_manager) from C++ on a cold cache. Hook outputs are
      # content-addressed, so restoring them only skips work — a stale entry
      # rebuilds by itself.
      - name: Cache native build hooks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .dart_tool/hooks_runner
          key: hooks-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: |
            hooks-runner-${{ runner.os }}-

      - name: Run tests
        run: flutter test --reporter compact
